[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "data-dictionary"
version = "0.1.0"
description = "MCP Server for a DataDictionary with DynamoDB and Bedrock integration"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "mangum>=0.19.0",
    "mcp-observatory[aws]>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[dynamodb]>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# "." puts the vendored contracts/ package on the path for
# tests/test_shared_table_contract.py; it is test-only and is not packaged.
pythonpath = ["src", "."]
